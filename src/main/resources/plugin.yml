name: BearBotBody
version: 0.1.0-SNAPSHOT
main: id.beruang.bearbotbody.BearBotBodyPlugin
api-version: '1.21'
description: BearBot Body physical-layer prototype
authors:
  - BearCraft
commands:
  bot:
    description: Control the BearBot physical body
    usage: /bot spawn | /bot despawn | /bot look <player|x y z> | /bot move <forward|backward|left|right> | /bot stop | /bot jump | /bot sprint [on|off] | /bot sneak [on|off] | /bot attack <player> | /bot interact <player> | /bot use [main|off] | /bot debug
    aliases:
      - bearbotbody
